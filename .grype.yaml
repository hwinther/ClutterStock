# Grype scanner configuration. Auto-discovered when grype runs from the
# repo root (the GitHub Actions workspace for anchore/scan-action), so this
# applies to all three image scans (api, migrator, frontend) without any
# workflow changes.
#
# Add an entry here for each false-positive or platform-irrelevant finding.
# Keep the `reason` short but specific — future you needs to remember why.
ignore:
  - vulnerability: CVE-2026-39883
    package:
      name: OpenTelemetry
    reason: >-
      Upstream CVE is a gopsutil PATH-hijack via the BSD `kenv` lookup. Our
      images run on Linux only (mcr.microsoft.com/dotnet/aspnet:10.0-noble-
      chiseled, gcr.io/distroless/nodejs26-debian13) and ship no gopsutil.
      Grype additionally mis-matches this CVE against the OpenTelemetry .NET
      SDK (UnknownPackage type) which has no code path to the affected
      function. Doubly inapplicable.
  # The rest are the same kind of false positive. NVD tags these CVEs with the generic
  # cpe:2.3:a:opentelemetry:opentelemetry CPE plus a target_sw naming another language; Grype's CPE
  # matcher ignores target_sw and hits the .NET OpenTelemetry NuGet package. The "fixed in"
  # versions belong to that other project (several are below the .NET 1.20.x we run).
  - vulnerability: CVE-2026-59892
    package:
      name: OpenTelemetry
    reason: >-
      OpenTelemetry JavaScript (@opentelemetry/propagator-jaeger, target_sw node.js), fixed in
      2.9.0; not the .NET SDK. The frontend's JS OpenTelemetry packages are matched by their own
      npm entries, not this CPE.
  - vulnerability: CVE-2026-54285
    package:
      name: OpenTelemetry
    reason: OpenTelemetry JavaScript (target_sw node.js), "fixed in" 2.8.0; not the .NET SDK.
  - vulnerability: CVE-2026-41178
    package:
      name: OpenTelemetry
    reason: OpenTelemetry-Go (target_sw go), "fixed in" 1.42.0; not the .NET SDK.
  - vulnerability: CVE-2026-39882
    package:
      name: OpenTelemetry
    reason: OpenTelemetry-Go (target_sw go), "fixed in" 1.43.0; not the .NET SDK.
  - vulnerability: CVE-2026-81869
    package:
      name: OpenTelemetry
    reason: OpenTelemetry-Go (target_sw go), "fixed in" 1.33.0; not the .NET SDK.
  - vulnerability: CVE-2026-81870
    package:
      name: OpenTelemetry
    reason: OpenTelemetry-Go (target_sw go), "fixed in" 1.45.0; not the .NET SDK.
  - vulnerability: CVE-2026-44967
    package:
      name: OpenTelemetry
    reason: OpenTelemetry C++ (target_sw c++), "fixed in" 1.27.0; not the .NET SDK.
