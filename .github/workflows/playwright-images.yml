name: "Playwright images"

# Builds the Playwright runner images in e2e/images/ for the @playwright/test version in
# e2e/package-lock.json and pushes them as ghcr.io/hwinther/clutterstock/playwright:<version>-<variant>,
# each with gzip and zstd layers (-zstd suffix), so e2e-image-benchmark.yml can compare pull and setup
# time against the runner + cache setup. Pull requests that touch the images build them without
# pushing.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "e2e/images/**"
      - ".github/workflows/playwright-images.yml"
  push:
    branches:
      - main
    paths:
      - "e2e/images/**"
      - "e2e/package-lock.json"
      - ".github/workflows/playwright-images.yml"

permissions: {}

concurrency:
  group: ${{ github.workflow }} @ ${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      playwright: ${{ steps.lock.outputs.playwright }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Playwright version from the lock file
        id: lock
        run: |
          set -euo pipefail
          v=$(jq -r '.packages["node_modules/@playwright/test"].version' e2e/package-lock.json)
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::No @playwright/test version"; exit 1; }
          echo "playwright=$v" >> "$GITHUB_OUTPUT"

  build:
    needs: [version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: [official, chromium, headless-shell]
        compression: [gzip, zstd]
        include:
          - variant: official
            base: "mcr.microsoft.com/playwright:v{0}-noble"
            install: ""
          - variant: chromium
            base: "node:26-bookworm-slim"
            install: "--with-deps chromium"
          - variant: headless-shell
            base: "node:26-bookworm-slim"
            install: "--with-deps --only-shell chromium"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag
        id: tag
        env:
          VERSION: ${{ needs.version.outputs.playwright }}
          VARIANT: ${{ matrix.variant }}
          COMPRESSION: ${{ matrix.compression }}
        run: |
          suffix=""
          [ "$COMPRESSION" = zstd ] && suffix="-zstd"
          echo "ref=ghcr.io/hwinther/clutterstock/playwright:${VERSION}-${VARIANT}${suffix}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: e2e/images
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE=${{ format(matrix.base, needs.version.outputs.playwright) }}
            PLAYWRIGHT_VERSION=${{ needs.version.outputs.playwright }}
            INSTALL_ARGS=${{ matrix.install }}
          provenance: false
          outputs: type=image,name=${{ steps.tag.outputs.ref }},push=${{ github.event_name != 'pull_request' }},oci-mediatypes=true,compression=${{ matrix.compression }},force-compression=true

      - name: Size
        if: ${{ github.event_name != 'pull_request' }}
        env:
          REF: ${{ steps.tag.outputs.ref }}
        run: |
          set -euo pipefail
          bytes=$(docker buildx imagetools inspect --raw "$REF" | jq '[.layers[].size] | add')
          echo "| \`$REF\` | $((bytes / 1000000)) MB |" >> "$GITHUB_STEP_SUMMARY"
