name: "PR build, scan, and E2E"

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types: [opened, reopened, labeled, synchronize, ready_for_review]
    paths:
      - "frontend/**"
      - "backend/**"
      - "e2e/**"
      # The preview runs this PR's deploy/ (the manifests job).
      - "deploy/**"
      - "docker-compose.e2e.yml"
      - ".github/workflows/pr-e2e.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "backend/**"
      - "e2e/**"
      - "docker-compose.e2e.yml"
      - ".github/workflows/pr-e2e.yml"

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  # Build only. On same-repo PRs each image goes to a staging tag (pr-<N>-<sha7>) and is handed
  # on as repo@digest, so the scans, e2e and the push all use the same bytes; Dependabot PRs and
  # pushes to main fall back to a workflow artifact. prune-ghcr.yml deletes staging tags once the
  # PR is closed.
  api:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    permissions:
      contents: read
      packages: write
    uses: hwinther/reusable-workflows/.github/workflows/build-image-dotnet.yml@c1e80ad637dcdd38bb6de0f447475c40a8625141 # v2.9.0
    with:
      dotnet_version: 10.0.x
      solution_path: backend
      solution_file: ClutterStock.slnx
      project_file: src/Api/Api.csproj
      container_registry: ghcr.io
      container_image_name_postfix: api

  migrator:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    permissions:
      contents: read
      packages: write
    uses: hwinther/reusable-workflows/.github/workflows/build-image-dotnet.yml@c1e80ad637dcdd38bb6de0f447475c40a8625141 # v2.9.0
    with:
      dotnet_version: 10.0.x
      solution_path: backend
      solution_file: ClutterStock.slnx
      project_file: src/Migrator/Migrator.csproj
      container_registry: ghcr.io
      container_image_name_postfix: migrator

  frontend:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    permissions:
      contents: read
      packages: write
    uses: hwinther/reusable-workflows/.github/workflows/build-image-docker.yml@c1e80ad637dcdd38bb6de0f447475c40a8625141 # v2.9.0
    with:
      container_registry: ghcr.io
      container_image_name_postfix: frontend
      build_context: frontend
      dockerfile: frontend/Dockerfile

  # The scans run next to e2e rather than before it.
  api-scan:
    needs: [api]
    permissions:
      contents: read
      packages: read
      actions: read
      security-events: write
      pull-requests: write
    uses: hwinther/reusable-workflows/.github/workflows/scan-image.yml@c1e80ad637dcdd38bb6de0f447475c40a8625141 # v2.9.0
    with:
      image: ${{ needs.api.outputs.image }}
      container_image_name_postfix: api
      grype_fail_build: auto

  migrator-scan:
    needs: [migrator]
    permissions:
      contents: read
      packages: read
      actions: read
      security-events: write
      pull-requests: write
    uses: hwinther/reusable-workflows/.github/workflows/scan-image.yml@c1e80ad637dcdd38bb6de0f447475c40a8625141 # v2.9.0
    with:
      image: ${{ needs.migrator.outputs.image }}
      container_image_name_postfix: migrator
      grype_fail_build: auto

  frontend-scan:
    needs: [frontend]
    permissions:
      contents: read
      packages: read
      actions: read
      security-events: write
      pull-requests: write
    uses: hwinther/reusable-workflows/.github/workflows/scan-image.yml@c1e80ad637dcdd38bb6de0f447475c40a8625141 # v2.9.0
    with:
      image: ${{ needs.frontend.outputs.image }}
      container_image_name_postfix: frontend
      grype_fail_build: auto

  e2e:
    needs: [api, migrator, frontend]
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    permissions:
      contents: read
      packages: read
      actions: read
      pull-requests: write
    uses: hwinther/reusable-workflows/.github/workflows/playwright-e2e.yml@c1e80ad637dcdd38bb6de0f447475c40a8625141 # v2.9.0
    with:
      compose_file: docker-compose.e2e.yml
      playwright_working_directory: e2e
      environment: build
      playwright_cache_enabled: true
      node_modules_cache_enabled: true
      image_artifacts_json: |
        {"API_IMAGE":"${{ needs.api.outputs.image }}",
         "MIGRATOR_IMAGE":"${{ needs.migrator.outputs.image }}",
         "FRONTEND_IMAGE":"${{ needs.frontend.outputs.image }}"}
    secrets:
      e2e_username: ${{ secrets.E2E_USERNAME }}
      e2e_password: ${{ secrets.E2E_PASSWORD }}
      e2e_otp_secret: ${{ secrets.E2E_OTP_SECRET }}

  push-api:
    needs: [api, api-scan, e2e]
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'deploy-feature') }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      actions: read
    uses: hwinther/reusable-workflows/.github/workflows/image-push.yml@c1e80ad637dcdd38bb6de0f447475c40a8625141 # v2.9.0
    with:
      container_registry: ghcr.io
      container_image_name_postfix: api
      artifact_name: ${{ needs.api.outputs.image }}
      container_image_tags: ${{ needs.api.outputs.container_image_tags }}
      image_digest: ${{ needs.api.outputs.image_digest }}
      version: ${{ needs.api.outputs.version }}
      sbom_artifact_name: ${{ needs.api-scan.outputs.sbom_artifact }}
      grype_artifact_name: ${{ needs.api-scan.outputs.grype_artifact }}
      sbom_cyclonedx_sha256: ${{ needs.api-scan.outputs.sbom_cyclonedx_sha256 }}
      grype_json_sha256: ${{ needs.api-scan.outputs.grype_json_sha256 }}

  push-migrator:
    needs: [migrator, migrator-scan, e2e]
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'deploy-feature') }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      actions: read
    uses: hwinther/reusable-workflows/.github/workflows/image-push.yml@c1e80ad637dcdd38bb6de0f447475c40a8625141 # v2.9.0
    with:
      container_registry: ghcr.io
      container_image_name_postfix: migrator
      artifact_name: ${{ needs.migrator.outputs.image }}
      container_image_tags: ${{ needs.migrator.outputs.container_image_tags }}
      image_digest: ${{ needs.migrator.outputs.image_digest }}
      version: ${{ needs.migrator.outputs.version }}
      sbom_artifact_name: ${{ needs.migrator-scan.outputs.sbom_artifact }}
      grype_artifact_name: ${{ needs.migrator-scan.outputs.grype_artifact }}
      sbom_cyclonedx_sha256: ${{ needs.migrator-scan.outputs.sbom_cyclonedx_sha256 }}
      grype_json_sha256: ${{ needs.migrator-scan.outputs.grype_json_sha256 }}

  push-frontend:
    needs: [frontend, frontend-scan, e2e]
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'deploy-feature') }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      actions: read
    uses: hwinther/reusable-workflows/.github/workflows/image-push.yml@c1e80ad637dcdd38bb6de0f447475c40a8625141 # v2.9.0
    with:
      container_registry: ghcr.io
      container_image_name_postfix: frontend
      artifact_name: ${{ needs.frontend.outputs.image }}
      container_image_tags: ${{ needs.frontend.outputs.container_image_tags }}
      image_digest: ${{ needs.frontend.outputs.image_digest }}
      version: ${{ needs.frontend.outputs.version }}
      sbom_artifact_name: ${{ needs.frontend-scan.outputs.sbom_artifact }}
      grype_artifact_name: ${{ needs.frontend-scan.outputs.grype_artifact }}
      sbom_cyclonedx_sha256: ${{ needs.frontend-scan.outputs.sbom_cyclonedx_sha256 }}
      grype_json_sha256: ${{ needs.frontend-scan.outputs.grype_json_sha256 }}

  # Renders the PR's deploy/ like a release, with the three images that just landed in GHCR pinned
  # to tag@digest, and pushes it as the signed artifact ghcr.io/hwinther/clutterstock/manifests:pr-<N>.
  # Signed in this job, so the identity is pr-e2e.yml@refs/pull/<N>/merge: the cluster's preview
  # OCIRepository accepts only that, and test/production only release tags.
  manifests:
    needs: [api, migrator, frontend, push-api, push-migrator, push-frontend]
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'deploy-feature') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      tag: pr-${{ github.event.pull_request.number }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Render, validate, push and sign
        id: push
        uses: hwinther/reusable-workflows/.github/actions/manifests@c1e80ad637dcdd38bb6de0f447475c40a8625141 # v2.9.0
        with:
          mode: push
          artifact: ghcr.io/hwinther/clutterstock/manifests
          tag: pr-${{ github.event.pull_request.number }}
          images: |
            ghcr.io/hwinther/clutterstock/api:${{ needs.api.outputs.version }}@${{ needs.push-api.outputs.image_digest }}
            ghcr.io/hwinther/clutterstock/migrator:${{ needs.migrator.outputs.version }}@${{ needs.push-migrator.outputs.image_digest }}
            ghcr.io/hwinther/clutterstock/frontend:${{ needs.frontend.outputs.version }}@${{ needs.push-frontend.outputs.image_digest }}
          renders: clutterstock.yaml=deploy

  # Deploys an ephemeral preview env to the homelab cluster via GitOps. The reusable workflow
  # mints a GitHub App installation token, clones hwinther/proxmox, renders the per-PR overlay
  # under clusters/production/apps/previews/clutterstock/, and pushes one commit. Flux reconciles
  # within ~1 min.
  #
  # Same `deploy-feature` label gate as the push-* jobs so a PR opts into push + deploy together.
  # The overlay pins the manifest artifact by digest, and the artifact pins the images.
  deploy-preview:
    needs: [manifests]
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'deploy-feature') }}
    permissions:
      contents: read
      pull-requests: write
    uses: hwinther/reusable-workflows/.github/workflows/gitops-preview-upsert.yml@c1e80ad637dcdd38bb6de0f447475c40a8625141 # v2.9.0
    with:
      target_repo: hwinther/proxmox
      preview_base_path: clusters/production/apps/previews/clutterstock
      pr_number: ${{ github.event.pull_request.number }}
      host: clutterstock-${{ github.event.pull_request.number }}.preview.wsh.no
      db_name: clutterstock_pr${{ github.event.pull_request.number }}
      app_name: clutterstock
      # The preview template pins the manifest artifact (which pins the images), not the images.
      image_tag: ${{ needs.manifests.outputs.tag }}
      image_digest: ${{ needs.manifests.outputs.digest }}
    secrets:
      app_id: ${{ secrets.PROXMOX_GITOPS_APP_ID }}
      app_private_key: ${{ secrets.PROXMOX_GITOPS_APP_PRIVATE_KEY }}

  # Single sticky PR comment with the preview URL once the GitOps commit has landed. Flux still
  # needs ~1 min to reconcile after this comment appears.
  comment-preview-url:
    needs: [deploy-preview, manifests]
    if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'deploy-feature') }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post or update preview-URL sticky comment
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          header: clutterstock-preview-env
          message: |
            ### Preview environment

            Deployed via Flux (reconciles within ~1 min) from the signed manifest artifact
            `manifests:${{ needs.manifests.outputs.tag }}` (this PR's `deploy/`), with the images
            that just passed e2e + grype pinned by digest.

            - Preview URL: ${{ needs.deploy-preview.outputs.preview_url }}
            - Database: `clutterstock_pr${{ github.event.pull_request.number }}` on `cluttertestdb.postgres-test`

            Closing the PR auto-removes the env via `pr-preview-cleanup.yml`.
