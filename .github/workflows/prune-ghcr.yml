name: "Prune GHCR images"

# Thin caller. The pruning logic lives in
# hwinther/reusable-workflows/.github/workflows/prune-ghcr.yml — see that
# workflow's header for the rules (untagged-orphan vs OCI 1.1 attestation,
# dead-branch prerelease tags, cosign legacy sig/att, etc.).
#
# Auth note:
#   ghcr.io/hwinther/* is a USER-scoped registry. The repo's GITHUB_TOKEN can
#   delete versions only when each package has "Inherit access from source
#   repository" enabled. If deletion 403s, set repo secret GHCR_PRUNE_TOKEN to
#   a PAT with `delete:packages` (and `read:packages` if you want auto-discovery
#   to enumerate private user packages). Passed through via secrets: inherit.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "When false, actually delete versions. Cron runs always force false."
        type: boolean
        default: true
      images:
        # Folded scalar (>-) so the source reads as a list but YAML resolves
        # to a single-line comma string. The workflow_dispatch UI flattens
        # `|` literal-block defaults and drops the newlines without inserting
        # a separator, so a `|` default becomes one giant concatenated token.
        description: "Comma-separated package names to prune. Blank = let the reusable workflow auto-discover by prefix."
        type: string
        default: >-
          clutterstock/api,
          clutterstock/migrator,
          clutterstock/frontend,
          clutterstock/allure-report,
          clutterstock/allure-history,
          clutterstock/badges-e2e,
          clutterstock/monocart-report,
          clutterstock/monocart-coverage,
          clutterstock/manifests
      nuke_package:
        description: "DESTRUCTIVE. Package name (e.g. 'clutterstock/allure-history') to delete entirely — leave blank for normal smart prune."
        type: string
        default: ""
  schedule:
    # Sundays 03:00 UTC. Cron always runs live (dry_run forced to false).
    - cron: "0 3 * * 0"

permissions:
  contents: read
  packages: write
  pull-requests: read

concurrency:
  group: prune-ghcr
  cancel-in-progress: false

jobs:
  prune:
    permissions:
      contents: read
      packages: write
      # v2.4.0 looks up open PRs to keep their pr-<N> / PullRequest<N> tags.
      pull-requests: read
    uses: hwinther/reusable-workflows/.github/workflows/prune-ghcr.yml@b8b6caf0ad38b8a338f9d1d824ba77c0dd7ab509 # v2.7.0
    with:
      # Scheduled runs prune for real; manual runs use the input. The old expression handed the
      # required boolean input a null on a schedule, so no scheduled run ever started.
      dry_run: ${{ github.event_name != 'schedule' && inputs.dry_run }}
      # Schedule events don't expose `inputs`, so mirror the workflow_dispatch
      # default as a single-line comma string. Keep this in sync with the
      # `images` input default above.
      images: ${{ inputs.images || 'clutterstock/api,clutterstock/migrator,clutterstock/frontend,clutterstock/allure-report,clutterstock/allure-history,clutterstock/badges-e2e,clutterstock/monocart-report,clutterstock/monocart-coverage,clutterstock/manifests' }}
      package_namespace_prefix: clutterstock/
      # When set on a manual run, bypasses the smart prune and deletes the
      # entire named package via the GHCR package DELETE API. Cron runs leave
      # inputs.nuke_package null so this resolves to '' and the smart prune
      # runs as usual.
      nuke_package: ${{ inputs.nuke_package || '' }}
    secrets: inherit
