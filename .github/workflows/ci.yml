name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types: [opened, reopened, labeled, synchronize, ready_for_review]

concurrency:
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  pr-build:
    permissions:
      contents: read
      checks: write
      pull-requests: write
      packages: read
    uses: hwinther/reusable-workflows/.github/workflows/pr-build.yml@533b9a2bdab2bc3b0b8b7b9ff673330932bd9641 # v2.47.0
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    with:
      node_enabled: true
      node_version: "26.x"
      node_working_directory: "frontend"
      node_changes_regex: "frontend/.*|backend/src/Api/openapi.json"
      node_extra_command: "npm run openapi-typescript"
      dotnet_enabled: true
      dotnet_version: "11.0.x"
      dotnet_working_directory: "backend"
      dotnet_solution_file: "ClutterStock.slnx"
      # Each build is a section of the one PR report comment (pr-report.yml), not a comment of its own.
      pr_report_enabled: true
