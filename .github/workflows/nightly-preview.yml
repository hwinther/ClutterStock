name: "Nightly preview E2E"

# Every night: deploys main (manifests:main, pushed and signed by pr-e2e.yml on every merge) to an
# ephemeral preview env, runs the whole e2e suite against it, then tears it down. Unlike the compose
# run in pr-e2e.yml this goes through the real chain: the OPNsense/NAXSI edge, Traefik and TLS,
# Authelia, Flux's signature check, Kyverno's secret clones, a fresh CNPG database and the network
# policies. A failure opens (or comments on) an issue labelled `nightly-preview`; the next green run
# closes it. The steps live in reusable-workflows' nightly-preview-e2e.yml.

on:
  workflow_dispatch:
  schedule:
    # 01:00 UTC, clear of the PBS backup window.
    - cron: "0 1 * * *"

permissions: {}

concurrency:
  group: nightly-preview
  cancel-in-progress: false

jobs:
  nightly:
    permissions:
      contents: read
      packages: read
      actions: read
      pull-requests: write
      issues: write
    uses: hwinther/reusable-workflows/.github/workflows/nightly-preview-e2e.yml@aadc90a4c71886ade7ae0418d9fdca5a94c4197e # v2.34.0
    with:
      app_name: clutterstock
      health_path: /healthz/ready
      db_name: clutterstock_nightly
      client_id: ${{ vars.PROXMOX_GITOPS_CLIENT_ID }}
    secrets:
      app_private_key: ${{ secrets.PROXMOX_GITOPS_APP_PRIVATE_KEY }}
      e2e_username: ${{ secrets.E2E_USERNAME }}
      e2e_password: ${{ secrets.E2E_PASSWORD }}
      e2e_otp_secret: ${{ secrets.E2E_OTP_SECRET }}
