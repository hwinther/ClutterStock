name: "Promote to production"

# Promotes a release (or rolls back to an older one) by opening the tag-bump PR in hwinther/proxmox
# for clutterstock-production. Test follows every release by itself (ref.semver), so this only
# handles production. Git stays the record of what runs there; merging the PR is the deploy.
#
# 1. check: the version's manifest artifact must carry the release signature
#    (container.yml@refs/tags/v<version>). A forward promotion must be the newest release, the one
#    test runs now; a rollback must be older than production and must not cross a contract
#    migration (see deploy/README.md) unless `force` is set.
# 2. promote: waits for approval on the `production` environment, co-signs the artifact digest with
#    this workflow's identity (production's OCIRepository accepts only that signature, so only an
#    approved artifact can run there), then opens or updates the proxmox PR.
#
# Dispatch from main only: the cosign identity pins promote.yml@refs/heads/main.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release to run in production, e.g. 0.30.0"
        required: true
        type: string
      rollback:
        description: "Roll back to an older release"
        type: boolean
        default: false
      force:
        description: "Allow a rollback across a contract migration (restore the database instead if you can)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: promote-production
  cancel-in-progress: false

env:
  ARTIFACT: ghcr.io/hwinther/clutterstock/manifests
  OIDC_ISSUER: https://token.actions.githubusercontent.com
  PROD_FILE: clusters/production/apps/clutterstock/clutterstock-manifests.yaml

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      current: ${{ steps.plan.outputs.current }}
      current_digest: ${{ steps.plan.outputs.current_digest }}
      digest: ${{ steps.plan.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Check the version, signature and migrations
        id: plan
        env:
          VERSION: ${{ inputs.version }}
          ROLLBACK: ${{ inputs.rollback }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          semver='^[0-9]+\.[0-9]+\.[0-9]+$'
          [[ "$VERSION" =~ $semver ]] || { echo "::error::version must be X.Y.Z, got '$VERSION'"; exit 1; }

          repo="${ARTIFACT#ghcr.io/}"
          token="$(curl -fsS "https://ghcr.io/token?scope=repository:${repo}:pull" | jq -r .token)"
          # The digest a tag points at, from the registry (the package is public).
          digest_of() {
            curl -fsSI -H "Authorization: Bearer $token" \
              -H "Accept: application/vnd.oci.image.manifest.v1+json" \
              "https://ghcr.io/v2/${repo}/manifests/$1" | tr -d '\r' | awk 'tolower($1) == "docker-content-digest:" { print $2 }'
          }
          # Every release artifact is signed by container.yml at its own tag.
          verify_release() {
            cosign verify "${ARTIFACT}@$2" \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/container.yml@refs/tags/v$1" \
              --certificate-oidc-issuer "$OIDC_ISSUER" > /dev/null
          }

          digest="$(digest_of "$VERSION")" || { echo "::error::no manifest artifact ${ARTIFACT}:${VERSION}"; exit 1; }
          verify_release "$VERSION" "$digest" || { echo "::error::${ARTIFACT}:${VERSION} is not signed by the release workflow"; exit 1; }

          current="$(curl -fsS "https://raw.githubusercontent.com/hwinther/proxmox/main/${PROD_FILE}" \
            | yq 'select(.kind == "OCIRepository") | .spec.ref.tag')"
          [[ "$current" =~ $semver ]] || { echo "::error::can't read production's tag from hwinther/proxmox ($current)"; exit 1; }
          current_digest="$(digest_of "$current")"
          newest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          newest="${newest#v}"
          older() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | head -n1)" = "$1" ]; }

          if [ "$VERSION" = "$current" ]; then
            echo "::notice::$VERSION already runs in production; this run only (re-)signs it."
          elif [ "$ROLLBACK" = true ]; then
            older "$VERSION" "$current" || { echo "::error::a rollback must be older than production ($current)"; exit 1; }
            # Contract migrations (named *_Contract*) drop or rename what older code still uses.
            # --no-renames: a migration that replaces another must count as added.
            contract="$(git diff --name-only --no-renames --diff-filter=A "v$VERSION" "v$current" -- \
              'backend/src/Infrastructure/Database/Migrations/*_Contract*.cs' | grep -v '\.Designer\.cs$' || true)"
            if [ -n "$contract" ]; then
              echo "Contract migrations between v$VERSION and v$current:"
              echo "$contract"
              if [ "$FORCE" != true ]; then
                echo "::error::v$VERSION's code doesn't work on the schema after these migrations. Restore the database instead, or re-run with force."
                exit 1
              fi
              echo "::warning::forced rollback across contract migrations"
            fi
          else
            older "$current" "$VERSION" || { echo "::error::$VERSION isn't newer than production ($current); use rollback"; exit 1; }
            [ "$VERSION" = "$newest" ] || { echo "::error::promote the release test runs now ($newest), not $VERSION"; exit 1; }
          fi

          {
            echo "current=$current"
            echo "current_digest=$current_digest"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Production promotion plan"
            echo
            echo "| | Version | Artifact digest |"
            echo "| --- | --- | --- |"
            echo "| Now | \`$current\` | \`$current_digest\` |"
            echo "| Requested | \`$VERSION\` | \`$digest\` |"
            echo
            echo "Rollback: \`$ROLLBACK\`, force: \`$FORCE\`. Release signature verified."
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    needs: check
    runs-on: ubuntu-latest
    # Required reviewers on this environment are the approval gate.
    environment:
      name: production
      url: ${{ steps.pr.outputs.url }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Set up cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Signed in this job, so the identity is promote.yml@refs/heads/main.
      - name: Co-sign the artifact
        env:
          DIGEST: ${{ needs.check.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          cosign sign --yes "${ARTIFACT}@${DIGEST}"

      - name: Mint a token for hwinther/proxmox
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.PROXMOX_GITOPS_APP_ID }}
          private-key: ${{ secrets.PROXMOX_GITOPS_APP_PRIVATE_KEY }}
          owner: hwinther
          repositories: proxmox
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout hwinther/proxmox
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hwinther/proxmox
          token: ${{ steps.token.outputs.token }}
          path: proxmox
          persist-credentials: true

      # One branch for every promotion, so a newer run replaces an unmerged one.
      - name: Open or update the promotion PR
        id: pr
        working-directory: proxmox
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          VERSION: ${{ inputs.version }}
          ROLLBACK: ${{ inputs.rollback }}
          FORCE: ${{ inputs.force }}
          CURRENT: ${{ needs.check.outputs.current }}
          CURRENT_DIGEST: ${{ needs.check.outputs.current_digest }}
          DIGEST: ${{ needs.check.outputs.digest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$VERSION" = "$CURRENT" ]; then
            echo "Production already pins $VERSION; signed only, no PR."
            exit 0
          fi
          branch=promote/clutterstock-production
          verb=$([ "$ROLLBACK" = true ] && echo "roll back" || echo "promote")
          title="chore(clutterstock): $verb production to $VERSION"

          git switch -C "$branch"
          yq -i '(select(.kind == "OCIRepository") | .spec.ref.tag) = strenv(VERSION)' "$PROD_FILE"
          git config user.name "proxmox-gitops-bot[bot]"
          git config user.email "proxmox-gitops-bot[bot]@users.noreply.github.com"
          git commit -am "$title" -m "Requested by @${GITHUB_TRIGGERING_ACTOR} in ${RUN_URL}"
          git push --force origin "$branch"

          {
            echo "Production ${verb}: \`$CURRENT\` → \`$VERSION\`, from [${GITHUB_REPOSITORY} promote.yml](${RUN_URL})."
            echo
            echo "| | Version | Artifact digest |"
            echo "| --- | --- | --- |"
            echo "| Now | \`$CURRENT\` | \`$CURRENT_DIGEST\` |"
            echo "| New | \`$VERSION\` | \`$DIGEST\` |"
            echo
            echo "- Release signature verified; approved on the \`production\` environment and co-signed by promote.yml."
            echo "- Requested by @${GITHUB_TRIGGERING_ACTOR}. Rollback: \`$ROLLBACK\`, force: \`$FORCE\`."
            echo "- Merging deploys it: Flux applies the artifact within ~10 minutes."
          } > "$RUNNER_TEMP/body.md"

          url="$(gh pr list --head "$branch" --state open --json url --jq '.[0].url // empty')"
          if [ -n "$url" ]; then
            gh pr edit "$url" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            url="$(gh pr create --base main --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/body.md")"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Promotion PR: $url" >> "$GITHUB_STEP_SUMMARY"
