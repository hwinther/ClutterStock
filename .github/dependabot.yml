# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
- package-ecosystem: "github-actions"
  directories:
  - "/"
  - "/.github/actions/*"
  open-pull-requests-limit: 20
  target-branch: "main"
  schedule:
    interval: "weekly"
    day: "sunday"
  cooldown:
    default-days: 7
  assignees:
  - "hwinther"
  groups:
    reusable-workflows:
      patterns:
      - "hwinther/reusable-workflows/*"

- package-ecosystem: "docker"
  directories:
  - "/"
  - "/frontend"
  open-pull-requests-limit: 20
  target-branch: "main"
  schedule:
    interval: "weekly"
    day: "sunday"
  cooldown:
    default-days: 7
  assignees:
  - "hwinther"

- package-ecosystem: "nuget"
  directory: "/backend"
  open-pull-requests-limit: 20
  target-branch: "main"
  schedule:
    interval: "weekly"
    day: "sunday"
  cooldown:
    default-days: 7
  assignees:
  - "hwinther"
  # update-dotnet-lockfiles triggers dependabot-update-dotnet-lockfiles.yml, which regenerates the
  # lock files of every project in the solution. Dependabot only rewrites the bumped project's own
  # packages.lock.json, so projects referencing it fail the locked-mode restore (NU1004) without it.
  # Setting labels replaces Dependabot's defaults, so those are listed too.
  labels:
  - "dependencies"
  - ".NET"
  - "update-dotnet-lockfiles"
  groups:
    microsoft:
      patterns:
      - "Microsoft.*"
      exclude-patterns:
      - "Microsoft.OpenApi"
      - "Microsoft.CodeAnalysis.*"
      - "Microsoft.Testing.*"
    # The source generators' Roslyn version must not exceed the compiler in the SDK that builds
    # them (SDK 10.0.4xx ships Roslyn 5.9; backend/global.json sets the minimum). Kept apart so a
    # Roslyn bump that needs a newer SDK doesn't block the rest of the Microsoft group.
    roslyn:
      patterns:
      - "Microsoft.CodeAnalysis.*"
    swashbuckle:
      patterns:
      - "Swashbuckle.*"
    # xunit.v3 and coverlet.MTP both run on Microsoft.Testing.Platform and require a minimum
    # version of it, so they move together (a lone xunit bump fails with NU1605).
    test-platform:
      patterns:
      - "xunit"
      - "xunit.*"
      - "coverlet.*"
      - "Microsoft.Testing.*"
    nunit:
      patterns:
      - "nunit"
      - "nunit.*"
    opentelemetry:
      patterns:
      - "OpenTelemetry.*"

- package-ecosystem: "npm"
  directories:
  - "/frontend"
  - "/scripts/badges"
  open-pull-requests-limit: 20
  target-branch: "main"
  schedule:
    interval: "weekly"
    day: "sunday"
  cooldown:
    default-days: 7
  assignees:
  - "hwinther"
  ignore:
  - dependency-name: "*"
    update-types: [ "version-update:semver-patch" ]
  groups:
    types:
      patterns:
      - "@types/*"
    eslint:
      patterns:
      - "eslint"
      - "eslint-*"
      - "@eslint/*"
      - "@typescript-eslint/*"
      - "*/eslint-plugin"
      - "*/eslint-plugin-*"
    react:
      patterns:
      - "react"
      - "react-*"
      - "@types/react*"
    testing:
      patterns:
      - "@testing-library/*"
      - "jsdom"
      - "msw"
    vite:
      patterns:
      - "vite"
      - "vite-*"
      - "@vitejs/*"
      - "vitest"
      - "@vitest/*"
    tanstack:
      patterns:
      - "@tanstack/*"
    code-quality:
      patterns:
      - "prettier"
      - "@cspell/*"
    build-tools:
      patterns:
      - "typescript"
      - "typescript-*"
      - "orval"
    opentelemetry:
      patterns:
      - "@opentelemetry/*"
    react-router:
      patterns:
      - "react-router"
      - "@react-router/*"

- package-ecosystem: "npm"
  directory: "/e2e"
  open-pull-requests-limit: 20
  target-branch: "main"
  schedule:
    interval: "weekly"
    day: "sunday"
  cooldown:
    default-days: 7
  assignees:
  - "hwinther"
  ignore:
  - dependency-name: "*"
    update-types: [ "version-update:semver-patch" ]
  groups:
    types:
      patterns:
      - "@types/*"
    eslint:
      patterns:
      - "eslint"
      - "@eslint/*"
      - "eslint-*"
      - "typescript-eslint"
      - "@typescript-eslint/*"
      - "*/eslint-plugin"
      - "*/eslint-plugin-*"
    playwright:
      patterns:
      - "@playwright/*"
    code-quality:
      patterns:
      - "prettier"
      - "@cspell/*"
    build-tools:
      patterns:
      - "typescript"
      - "typescript-*"
    utilities:
      patterns:
      - "dotenv"
      - "globals"
