# One host: /api and /swagger go to the API, everything else to the SSR frontend. Attaches to the
# cluster's platform Gateway (listener `web`); the target namespace must be allowed to attach routes
# and be granted the hostname. The gethomepage.dev annotations are inert on clusters without homepage.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: clutterstock
  annotations:
    # Homepage otherwise derives the link from the first rule (/api); pin the frontend root.
    gethomepage.dev/href: "https://${APP_HOST}/"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Apps
    gethomepage.dev/name: "${HOMEPAGE_NAME:=Clutterstock}"
    gethomepage.dev/siteMonitor: "https://${APP_HOST}"
    gethomepage.dev/icon: mdi-image-multiple-outline
    gethomepage.dev/description: Clutterstock web app (API under /api/; Swagger under /swagger)
    # Both Deployments back this host.
    gethomepage.dev/pod-selector: app in (clutterstock-frontend, clutterstock-api)
spec:
  parentRefs:
  - name: "${GATEWAY_NAME:=traefik}"
    namespace: "${GATEWAY_NAMESPACE:=traefik}"
    sectionName: "${GATEWAY_LISTENER:=web}"
  hostnames:
  - "${APP_HOST}"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api
    - path:
        type: PathPrefix
        value: /swagger
    backendRefs:
    - name: clutterstock-api
      port: 8080
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: clutterstock-frontend
      port: 8080
