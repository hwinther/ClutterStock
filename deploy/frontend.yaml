# ClutterStock frontend: React Router 7 SSR server. It does the OIDC/PKCE flow server-side and keeps
# sessions in Valkey/Redis, so no tokens reach the browser. Variables: see api.yaml and README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clutterstock-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clutterstock-frontend
  template:
    metadata:
      labels:
        app: clutterstock-frontend
        app.kubernetes.io/name: clutterstock-frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: clutterstock-frontend
        image: ghcr.io/hwinther/clutterstock/frontend
        # Releases pin tag@digest, so a cached image is always the right one.
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
        env:
        - name: PORT
          value: "8080"
        - name: SERVER_API_URL
          value: "http://clutterstock-api:8080"
        - name: PUBLIC_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
          value: "https://${APP_HOST}/v1/traces"
        - name: PUBLIC_OTEL_SERVICE_NAME
          value: "clutterstock-frontend"
        # The SSR server's own traces and logs (CSP violation reports among them), over OTLP/HTTP.
        # Empty leaves the SDK on its localhost default, i.e. exporting nowhere.
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "${OTEL_EXPORTER_OTLP_HTTP_ENDPOINT:=}"
        # Tells test, production and previews apart in Loki/Prometheus (service_namespace), as in api.yaml.
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "service.namespace=$(POD_NAMESPACE),deployment.environment=${APP_ENVIRONMENT:=production}"
        # The CSP is enforced. report-only (Content-Security-Policy-Report-Only: reported, not
        # blocked) is an emergency switch for when the policy breaks a page and a release can't wait.
        - name: CSP_MODE
          value: "${CSP_MODE:=enforce}"
        # Read at runtime by oidc.server.ts via process.env (the SSR code uses process.env.VITE_*,
        # so they aren't inlined at build time).
        - name: VITE_OIDC_AUTHORITY
          value: "${OIDC_AUTHORITY}"
        - name: VITE_OIDC_CLIENT_ID
          value: "${OIDC_CLIENT_ID:=clutterstock}"
        # Builds redirect_uri / post_logout_redirect_uri. Required because the ingress terminates
        # TLS and the pod sees plain http.
        - name: PUBLIC_ORIGIN
          value: "https://${APP_HOST}"
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: clutterstock-valkey
              key: redis-url
---
apiVersion: v1
kind: Service
metadata:
  name: clutterstock-frontend
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: clutterstock-frontend
